services:
  orchestrator:
    build:
      context: .
      dockerfile: containers/orchestrator.Containerfile
    command: ["uvicorn", "software_factory.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      SOFTWARE_FACTORY_REPOSITORY_PATH: /app
      SOFTWARE_FACTORY_REPOSITORY_OWNER: ${SOFTWARE_FACTORY_REPOSITORY_OWNER}
      SOFTWARE_FACTORY_REPOSITORY_NAME: ${SOFTWARE_FACTORY_REPOSITORY_NAME}
      SOFTWARE_FACTORY_GITHUB_TOKEN: ${SOFTWARE_FACTORY_GITHUB_TOKEN}
      SOFTWARE_FACTORY_WORKER_IMAGE: ${SOFTWARE_FACTORY_WORKER_IMAGE:-localhost/software-factory-worker:latest}
      SOFTWARE_FACTORY_MAX_PARALLEL_WORKERS: ${SOFTWARE_FACTORY_MAX_PARALLEL_WORKERS:-4}
      SOFTWARE_FACTORY_SCHEDULER_POLL_INTERVAL_SECONDS: ${SOFTWARE_FACTORY_SCHEDULER_POLL_INTERVAL_SECONDS:-15}
      SOFTWARE_FACTORY_AGENT_HEARTBEAT_INTERVAL_SECONDS: ${SOFTWARE_FACTORY_AGENT_HEARTBEAT_INTERVAL_SECONDS:-5}
      SOFTWARE_FACTORY_DEVELOPER_COMMAND: ${SOFTWARE_FACTORY_DEVELOPER_COMMAND}
      SOFTWARE_FACTORY_REVIEWER_COMMAND: ${SOFTWARE_FACTORY_REVIEWER_COMMAND}
      SOFTWARE_FACTORY_MERGER_COMMAND: ${SOFTWARE_FACTORY_MERGER_COMMAND}
      SOFTWARE_FACTORY_AUTO_APPROVE_PULL_REQUESTS: ${SOFTWARE_FACTORY_AUTO_APPROVE_PULL_REQUESTS:-false}
      SOFTWARE_FACTORY_AUTO_MERGE_PULL_REQUESTS: ${SOFTWARE_FACTORY_AUTO_MERGE_PULL_REQUESTS:-false}
      SOFTWARE_FACTORY_DRY_RUN: ${SOFTWARE_FACTORY_DRY_RUN:-true}
    volumes:
      - .:/app

  scheduler:
    build:
      context: .
      dockerfile: containers/orchestrator.Containerfile
    command: ["python", "-m", "software_factory.cli", "run-scheduler"]
    environment:
      SOFTWARE_FACTORY_REPOSITORY_PATH: /app
      SOFTWARE_FACTORY_REPOSITORY_OWNER: ${SOFTWARE_FACTORY_REPOSITORY_OWNER}
      SOFTWARE_FACTORY_REPOSITORY_NAME: ${SOFTWARE_FACTORY_REPOSITORY_NAME}
      SOFTWARE_FACTORY_GITHUB_TOKEN: ${SOFTWARE_FACTORY_GITHUB_TOKEN}
      SOFTWARE_FACTORY_WORKER_IMAGE: ${SOFTWARE_FACTORY_WORKER_IMAGE:-localhost/software-factory-worker:latest}
      SOFTWARE_FACTORY_MAX_PARALLEL_WORKERS: ${SOFTWARE_FACTORY_MAX_PARALLEL_WORKERS:-4}
      SOFTWARE_FACTORY_SCHEDULER_POLL_INTERVAL_SECONDS: ${SOFTWARE_FACTORY_SCHEDULER_POLL_INTERVAL_SECONDS:-15}
      SOFTWARE_FACTORY_AGENT_HEARTBEAT_INTERVAL_SECONDS: ${SOFTWARE_FACTORY_AGENT_HEARTBEAT_INTERVAL_SECONDS:-5}
      SOFTWARE_FACTORY_DEVELOPER_COMMAND: ${SOFTWARE_FACTORY_DEVELOPER_COMMAND}
      SOFTWARE_FACTORY_REVIEWER_COMMAND: ${SOFTWARE_FACTORY_REVIEWER_COMMAND}
      SOFTWARE_FACTORY_MERGER_COMMAND: ${SOFTWARE_FACTORY_MERGER_COMMAND}
      SOFTWARE_FACTORY_AUTO_APPROVE_PULL_REQUESTS: ${SOFTWARE_FACTORY_AUTO_APPROVE_PULL_REQUESTS:-false}
      SOFTWARE_FACTORY_AUTO_MERGE_PULL_REQUESTS: ${SOFTWARE_FACTORY_AUTO_MERGE_PULL_REQUESTS:-false}
      SOFTWARE_FACTORY_DRY_RUN: ${SOFTWARE_FACTORY_DRY_RUN:-true}
    volumes:
      - .:/app

  worker-base:
    build:
      context: .
      dockerfile: containers/worker.Containerfile
    command: ["python", "-m", "software_factory.cli", "run-worker"]
    environment:
      SOFTWARE_FACTORY_REPOSITORY_PATH: /workspace
    profiles: ["manual"]
    volumes:
      - .:/app

