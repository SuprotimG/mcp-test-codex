[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory-mvp"
version = "0.1.0"
description = "Swarm orchestration framework for an autonomous software factory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "jinja2>=3.1.4,<4.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "typer>=0.16.0,<1.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.scripts]
software-factory = "software_factory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
